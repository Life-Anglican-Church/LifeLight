<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';"><title>Connect to LifeAC Lighting</title><style>body{margin:0;background:#10191e;color:#e5eff0;font:16px 'Segoe UI',sans-serif;display:grid;place-items:center;min-height:100vh}.panel{width:min(520px,80vw);padding:40px;background:#19252d;border:1px solid #344951;border-radius:18px}img{width:230px}h1{font-size:28px;font-weight:600;margin:32px 0 14px}p{color:#a8bec2;line-height:1.7}code{display:block;overflow-wrap:anywhere;color:#91d9c6;margin:20px 0}button{border:1px solid #4a7074;border-radius:8px;color:#e5eff0;background:#315e68;padding:12px 18px;margin:15px 8px 0 0;cursor:pointer;font:inherit}.spinner{height:4px;background:#314650;overflow:hidden;border-radius:4px;margin-top:24px}.spinner:after{content:'';display:block;width:30%;height:100%;background:#69d8ba;animation:scan 1.4s infinite ease-in-out}@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(450%)}}[hidden]{display:none!important}</style><script src="connection.js" defer></script></head><body><section class="panel"><img src="../web/assets/lifeac-wordmark.png" alt="Life Anglican Church"><h1 id="heading">Connecting to your lighting host</h1><p id="message">Establishing a secure connection. If asked, compare the host certificate with Settings on the host PC.</p><code id="address"></code><div id="progress" class="spinner" role="status" aria-label="Connecting"></div><div id="actions" hidden><button id="retry">Try again</button><button id="choose">Choose another host</button></div><p>Once connected, sign in with a username and password created in the host’s LAN &amp; accounts settings.</p></section></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LifeAC Lighting</title><link rel="icon" href="assets/lifeac.ico"><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body>
<div id="startup" role="status"><img src="assets/lifeac-mark.png" alt="Life Anglican Church"><p class="vision">We glorify God together,<br>making disciples of all nations</p><div class="track"><span></span></div><p id="startup-text">Loading your lighting…</p></div>
<header><div class="top"><img src="assets/lifeac-wordmark.png" alt="Life Anglican Church"><span class="product">LIGHTING</span><span id="connection" class="sr-only">Loading…</span><button id="service-dim" class="header-action" type="button" aria-pressed="false" title="Mute the configured 11am lights">11am</button><button id="settings-button" class="header-action" hidden>⚙ Settings</button><button id="mode" class="header-action" hidden>Volunteer view</button><div class="status-icons"><button id="midi-status" class="status-icon" data-state="disconnected"><i></i>MIDI</button><button id="dmx-status" class="status-icon" data-state="disconnected"><i></i>DMX</button><button id="manual-status" class="status-icon" hidden>☷ Manual</button></div></div><nav aria-label="Main navigation"><div id="tabs"><button data-tab="scenes" class="selected">Scenes</button></div><span id="saved"></span></nav></header>
<main><div id="collaboration" class="card" role="status" hidden></div><div id="live-adjustments" class="card" role="status" hidden></div><div id="error" role="alert" hidden></div><section id="login" hidden><div class="card login"><p class="eyebrow">LIFEAC LIGHTING</p><h1>Welcome back.</h1><p>Sign in to control the church lighting.</p><form id="login-form"><label>Username<input name="name" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button></form><p class="small">On the projector PC, open LifeAC Lighting using its Windows launcher.</p></div></section><div id="content"></div></main>
<footer><span id="footer-status">No output sent on startup.</span><span>LifeAC Lighting · 0.6.0</span></footer>
<div id="scene-menu" class="context-menu" role="menu" hidden></div><dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="Close dialog">×</button></div><div id="dialog-body"></div><div id="dialog-error" role="alert" hidden></div><div id="dialog-actions"></div></dialog>
</body></html>
